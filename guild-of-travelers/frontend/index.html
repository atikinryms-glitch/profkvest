<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таверна «Путь Героя» - Гильдия Путников</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background -->
    <div id="background" class="background-overlay"></div>
    
    <!-- Particle Canvas -->
    <div id="particleContainer"></div>
    
    <!-- Main Container -->
    <div class="container animate-in">
        <header>
            <img src="images/guild-emblem.png" alt="Эмблема Гильдии" class="guild-emblem" onerror="this.style.display='none'">
            <h1 class="magical-text">Таверна «Путь Героя»</h1>
            <p class="subtitle">Гильдия Путников приглашает тебя в приключение!</p>
        </header>
        
        <main>
            <div class="registration-form">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="questCode">Твой код доступа</label>
                        <input 
                            type="text" 
                            id="questCode" 
                            name="code" 
                            placeholder="Пример: 8А02, 11Б15"
                            required
                            maxlength="6"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="heroName">Имя твоего героя</label>
                        <input 
                            type="text" 
                            id="heroName" 
                            name="heroName" 
                            placeholder="Как тебя называть?"
                            required
                            minlength="2"
                            maxlength="30"
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-full glow-effect">
                        ⚔️ Войти в таверну
                    </button>
                    
                    <div id="errorMessage" class="error-message"></div>
                </form>
            </div>
        </main>
    </div>
    
    <script src="js/effects.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
