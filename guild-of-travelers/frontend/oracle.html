<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната Оракула - Гильдия Путников</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background -->
    <div id="background" class="background-overlay"></div>
    
    <!-- Particle Canvas -->
    <div id="particleContainer"></div>
    
    <!-- Crystal Ball Effect -->
    <div class="crystal-ball"></div>
    
    <!-- Main Container -->
    <div class="container">
        <header>
            <h2 class="magical-text">🔮 Комната Оракула</h2>
        </header>
        
        <main>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            
            <div id="questionCounter" class="question-counter"></div>
            
            <div id="questionsContainer" class="situation-card">
                <!-- Questions will be loaded here -->
            </div>
            
            <div id="oracleFinal" class="result-card" style="display: none; text-align: center;">
                <h3 class="magical-text" style="color: var(--gold-primary); margin-bottom: 20px;">
                    Оракул увидел твой путь...
                </h3>
                <p style="font-size: 1.1em; margin-bottom: 30px; color: var(--brown-dark);">
                    Ты прошёл испытания Оракула. Теперь отправляйся в Зал Совета для дальнейших испытаний!
                </p>
                <a href="quest.html" class="btn glow-effect">
                    ⚔️ Перейти к испытаниям
                </a>
            </div>
        </main>
    </div>
    
    <script src="js/effects.js"></script>
    <script src="js/oracle.js"></script>
</body>
</html>
