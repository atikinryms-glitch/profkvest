<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зал Совета - Гильдия Путников</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background -->
    <div id="background" class="background-overlay"></div>
    
    <!-- Particle Canvas -->
    <div id="particleContainer"></div>
    
    <!-- Main Container -->
    <div class="container">
        <header>
            <h2 class="magical-text">⚔️ Зал Совета Гильдий</h2>
        </header>
        
        <main>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar gold"></div>
            </div>
            
            <div id="situationsContainer">
                <!-- Situations will be loaded here -->
            </div>
            
            <div id="questFinal" class="result-card" style="display: none; text-align: center;">
                <h3 class="magical-text" style="color: var(--gold-primary); margin-bottom: 20px;">
                    Испытания завершены!
                </h3>
                <p style="font-size: 1.1em; margin-bottom: 30px; color: var(--brown-dark);">
                    Ты прошёл все испытания Зала Совета. Теперь узнай свою судьбу!
                </p>
                <a href="destiny.html" class="btn glow-effect">
                    📜 Узнать свою судьбу
                </a>
            </div>
        </main>
    </div>
    
    <script src="js/effects.js"></script>
    <script src="js/quest.js"></script>
</body>
</html>
